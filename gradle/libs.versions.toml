# --- CAMERA / MEDIA ---
cameraX = "1.5.1"

# --- COMPOSE / UI ---
composeBom = "2025.11.00"
composeCompiler = "2.2.21"
material3 = "1.4.0"
shimmer = "0.5.0"
uiText = "1.9.4"

# --- DATA / ROOM ---
roomCommonJvm = "2.8.3"
roomRuntimeAndroid = "2.8.3"
roomExternalAntlr = "2.8.3"

# --- FIREBASE / GOOGLE ---
firebaseAuthKtx = "24.0.1"
firebaseBom = "34.5.0"
firebaseCrashlyticsBuildtools = "3.0.6"
gson = "2.13.2"
litert = "2.0.3"
protoliteWellKnownTypes = "18.0.1"
